spring.application.name=ExchangeCurrencies

# Local development database (started with docker compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/exchange_currencies}
spring.datasource.username=${DB_USERNAME:exchange}
spring.datasource.password=${DB_PASSWORD:exchange}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
