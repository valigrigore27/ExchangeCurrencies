services:
  postgres:
    image: postgres:17-alpine
    container_name: exchange-currencies-postgres
    environment:
      POSTGRES_DB: exchange_currencies
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    ports:
      - "5433:5432"
    volumes:
      - exchange_currencies_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange_currencies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exchange_currencies_pgdata:
